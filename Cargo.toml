[package]
name = "pg_solver"
version = "0.1.0"
edition = "2021"
description = "PostgreSQL Autonomous Query Optimizer & Slow-Query Killer powered by Geometric Solver"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pgrx = "0.12.0"

[dev-dependencies]
pgrx-tests = "0.12.0"

[features]
default = ["pg16"]
pro = []
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg_test = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
